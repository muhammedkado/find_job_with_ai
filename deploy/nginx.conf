# /etc/nginx/sites-available/findjob.mkado.dev
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name findjob.mkado.dev;

    root /var/www/findjob/public;
    index index.php;

    ssl_certificate     /etc/ssl/cloudflare/mkado.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mkado.dev.key;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 3m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/findjob.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 90;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name findjob.mkado.dev;
    return 301 https://$host$request_uri;
}
